name: Validate GTFS

on:
  pull_request:
    paths:
      - "GTFS-Peru-Arequipa/out/**"
      - "Backend-Services/otp/data/gtfs.zip"
  push:
    branches: [main]
    paths:
      - "GTFS-Peru-Arequipa/out/**"
      - "Backend-Services/otp/data/gtfs.zip"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Download MobilityData gtfs-validator
        run: |
          URL=$(curl -s https://api.github.com/repos/MobilityData/gtfs-validator/releases/latest | grep browser_download_url | grep 'cli.jar"' | cut -d'"' -f4)
          echo "validator: $URL"
          curl -sL -o gtfs-validator-cli.jar "$URL"
      - name: Validate the builder output
        run: |
          java -jar gtfs-validator-cli.jar -i GTFS-Peru-Arequipa/out/city.gtfs.zip -o report-out -c pe
          python3 - <<'PY'
          import json
          r = json.load(open("report-out/report.json"))
          errors = [n for n in r["notices"] if n["severity"] == "ERROR"]
          for n in r["notices"]:
              print(f'{n["severity"]:8s} {n["totalNotices"]:6d}  {n["code"]}')
          if errors:
              raise SystemExit(f"{len(errors)} error notice type(s) in GTFS-Peru-Arequipa/out/city.gtfs.zip")
          PY
      - name: The server zip must be the builder output
        if: hashFiles('Backend-Services/otp/data/gtfs.zip') != ''
        run: |
          if ! cmp -s GTFS-Peru-Arequipa/out/city.gtfs.zip Backend-Services/otp/data/gtfs.zip; then
            echo "::warning::Backend-Services/otp/data/gtfs.zip differs from GTFS-Peru-Arequipa/out/city.gtfs.zip (regenerate and copy, do not re-zip by hand)"
            unzip -l Backend-Services/otp/data/gtfs.zip | grep -q __MACOSX && { echo "::error::Backend-Services/otp/data/gtfs.zip carries __MACOSX entries"; exit 1; }
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gtfs-validator-report
          path: report-out
