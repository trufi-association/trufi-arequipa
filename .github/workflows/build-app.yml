name: Build app

on:
  pull_request:
    paths:
      - "Arequipa-Bus-App/**"
  push:
    branches: [main]
    paths:
      - "Arequipa-Bus-App/**"

jobs:
  android-debug:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Arequipa-Bus-App
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Read the Flutter version from .fvmrc
        id: fvm
        run: echo "version=$(python3 -c 'import json; print(json.load(open(".fvmrc"))["flutter"])')" >> "$GITHUB_OUTPUT"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ steps.fvm.outputs.version }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos --no-fatal-warnings
      - run: flutter build apk --debug
