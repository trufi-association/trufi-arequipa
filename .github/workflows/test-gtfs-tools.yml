name: Test GTFS tools

on:
  pull_request:
    paths:
      - "GTFS-Peru-Arequipa/**"
      - "!GTFS-Peru-Arequipa/out/**"
  push:
    branches: [main]
    paths:
      - "GTFS-Peru-Arequipa/**"
      - "!GTFS-Peru-Arequipa/out/**"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: GTFS-Peru-Arequipa
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: GTFS-Peru-Arequipa/.nvmrc
          cache: npm
          cache-dependency-path: GTFS-Peru-Arequipa/package-lock.json
      - run: npm ci
      - run: npm test
