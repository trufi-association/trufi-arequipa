name: Build app

on:
  pull_request:
    paths:
      - "Arequipa-Bus-App/**"
  push:
    branches: [main]
    paths:
      - "Arequipa-Bus-App/**"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android-debug:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: Arequipa-Bus-App
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - uses: subosito/flutter-action@v2
        with:
          flutter-version-file: Arequipa-Bus-App/.fvmrc
          channel: stable
          cache: true
          pub-cache: true
      - run: flutter pub get
      - run: git diff --exit-code -- analysis_options.yaml || { echo "::error::flutter pub get rewrote analysis_options.yaml - commit the migrated file"; exit 1; }
      - run: flutter analyze --no-fatal-infos --no-fatal-warnings
      - run: flutter build apk --debug
